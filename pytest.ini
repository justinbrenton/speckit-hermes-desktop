[pytest]
# Two suites, deliberately separated.
#
# `hermes` marks tests that import Hermes internals (`hermes_cli.web_server_dashboard`,
# `hermes_cli.kanban_db_connect`). They only mean something on an interpreter that
# has Hermes installed, so CI runs them in their own job with Hermes pinned. The
# router suite deselects them instead of skipping them, because a skip and a pass
# look identical in a green build.
markers =
    hermes: needs a Hermes install (hermes_cli) importable on the interpreter

addopts = --strict-markers
