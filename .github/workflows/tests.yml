name: tests

# The plugin's own suites. The backend suite turned out not to need a Hermes
# install: it imports the router and drives it with Starlette's test client, and
# the only Hermes imports are lazy, inside the Kanban routes. So it runs on all
# three platforms here. The one thing CI cannot exercise is a real `specify`
# dispatch, because that needs the CLI.

on:
  push:
    branches: [master]
  # No base-branch filter: a stacked PR is still a PR, and it had no checks at all
  # while this was limited to master.
  pull_request:

permissions:
  contents: read

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test

  backend:
    # The router suite: everything that does not need Hermes itself.
    name: backend (router, ${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          # The oldest and newest interpreter the plugin is likely to meet.
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - name: Run the router suite
        run: python -m pytest tests/backend -q -m "not hermes" --junitxml=junit.xml
      - name: The suite must not skip anything it is not expected to skip
        if: always()
        run: python scripts/check-skips.py junit.xml

  hermes-integration:
    # The tests that import Hermes internals: dashboard mounting and the Kanban
    # bridge. They are deselected from the matrix above, not skipped, so this job
    # is the only thing between a broken integration and a green build.
    name: backend (hermes integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Must satisfy plugin.yaml's requires_hermes floor. This is the commit this
      # plugin is developed against; bump both together.
      HERMES_COMMIT: bda3a363e9695e3f63fce4a7ca85ba17b5fecb61
      # A literal path: the runner context is not available in a job-level env
      # block, and GitHub rejects the whole workflow when it is used there.
      HERMES_SRC: /tmp/hermes-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Stage Hermes at the pinned commit
        # A git fetch rather than the codeload tarball: codeload rate-limits by IP,
        # and a busy afternoon of pushes returned 429 here. Fetching one commit is
        # just as deterministic and does not share that quota.
        run: |
          mkdir -p "$HERMES_SRC"
          cd "$HERMES_SRC"
          git init -q .
          git remote add origin https://github.com/NousResearch/hermes-agent.git
          git fetch -q --depth 1 origin "$HERMES_COMMIT"
          git checkout -q FETCH_HEAD
          echo "staged $(git rev-parse --short HEAD)"
          uv sync --frozen --no-install-project
          uv pip install --python "$HERMES_SRC/.venv/bin/python" -r "$GITHUB_WORKSPACE/requirements-dev.txt"
      - name: Confirm Hermes really imports
        run: |
          PYTHONPATH="$HERMES_SRC" "$HERMES_SRC/.venv/bin/python" -c \
            "import hermes_cli.web_server_dashboard, hermes_cli.kanban_db_connect; print('hermes imports ok')"
      - name: Run the Hermes integration tests
        run: |
          PYTHONPATH="$HERMES_SRC" "$HERMES_SRC/.venv/bin/python" -m pytest tests/backend \
            -q -m hermes --junitxml=junit.xml
      - name: No silent skips
        if: always()
        # Five tests here by design: this job runs the hermes-marked subset.
        run: python scripts/check-skips.py junit.xml --min 5
      - name: Preflight (counts, doc numbers, generated HTML)
        env:
          PREFLIGHT_PYTHON: /tmp/hermes-agent/.venv/bin/python
          PYTHONPATH: /tmp/hermes-agent
        run: node scripts/preflight.mjs

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Compile the backend and its tests
        run: python -m py_compile dashboard/plugin_api.py tests/backend/*.py
      - name: Manifest parity
        run: python scripts/check-manifests.py
