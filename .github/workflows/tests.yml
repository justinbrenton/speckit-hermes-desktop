name: tests

# The plugin's own suites. The backend suite turned out not to need a Hermes
# install: it imports the router and drives it with Starlette's test client, and
# the only Hermes imports are lazy, inside the Kanban routes. So it runs on all
# three platforms here. The one thing CI cannot exercise is a real `specify`
# dispatch, because that needs the CLI.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test

  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          # The oldest and newest interpreter the plugin is likely to meet.
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - name: Run the backend suite
        run: python -m pytest tests/backend -q --junitxml=junit.xml
      - name: The suite must not skip anything it is not expected to skip
        if: always()
        run: python scripts/check-skips.py junit.xml

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Compile the backend and its tests
        run: python -m py_compile dashboard/plugin_api.py tests/backend/*.py
      - name: Manifest parity
        run: python scripts/check-manifests.py
