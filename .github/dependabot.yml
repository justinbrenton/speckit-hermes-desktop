# Dependabot configuration for automated dependency updates
version: 2
updates:
  # npm dependencies (frontend/build)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(npm): "
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Ignore major version updates for core dependencies (use version ranges)
      - dependency-name: "node"
        versions: [">=22.0.0"]
      - dependency-name: "typescript"
        versions: [">=6.0.0"]

  # Python dependencies (backend)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(pip): "
    labels:
      - "dependencies"
      - "python"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Ignore major version updates for core dependencies
      - dependency-name: "python"
        versions: [">=3.13.0"]
      - dependency-name: "fastapi"
        versions: [">=1.0.0"]
      - dependency-name: "pydantic"
        versions: [">=3.0.0"]
      - dependency-name: "pytest"
        versions: [">=8.0.0"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(github-actions): "
    labels:
      - "dependencies"
      - "github-actions"